<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#061122"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- App Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="4"/>
  
  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#06b6d4" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#06b6d4" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="2"/>
  
  <!-- Shield Emblem -->
  <path d="M 256 90 L 370 140 C 370 270, 256 360, 256 410 C 256 360, 142 270, 142 140 Z" fill="url(#shieldGrad)" filter="url(#glow)" opacity="0.9"/>
  <path d="M 256 110 L 350 152 C 350 258, 256 335, 256 380 C 256 335, 162 258, 162 152 Z" fill="#071324" opacity="0.95"/>
  
  <!-- Ocean Surge Wave Inside Shield -->
  <path d="M 180 260 C 210 240, 230 280, 260 250 C 290 220, 310 270, 332 250 C 332 280, 320 310, 256 350 C 192 310, 180 280, 180 260 Z" fill="#06b6d4" opacity="0.7"/>
  
  <!-- Alert Sparkle Center -->
  <circle cx="256" cy="200" r="14" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="256" cy="200" r="6" fill="#ffffff"/>
  
  <!-- Text Monogram -->
  <text x="256" y="470" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="4">RESQNET AI</text>
</svg>
